name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, tests and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit tests (Surefire), integration tests with Testcontainers (Failsafe),
      # JaCoCo report and SpotBugs + FindSecBugs gate.
      - run: ./mvnw -B -ntp verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-analysis-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/spotbugsXml.xml
            demo-api/target/surefire-reports/
            demo-api/target/spotbugsXml.xml
          if-no-files-found: ignore

  compose-check:
    name: Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      # RNF-SEG-15: nothing may be published outside 127.0.0.1.
      - run: ./scripts/check-compose-ports.sh
      # ADR-011: only the proxy mounts the Docker socket, read-only, without ports, POST=0, internal network.
      - run: ./scripts/check-compose-docker-socket.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --verbose /repo

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      # Build only; publishing to a registry comes with the MVP closing slice (docs/07-plano-do-mvp.md).
      - run: docker build --file backend/Dockerfile --tag devops-agent:ci .
      - run: docker build --file demo-api/Dockerfile --tag devops-demo-api:ci .
      # Slice 9c: image scan. What the images contain is recorded by severity (job summary and artifact), and
      # only a CRITICAL vulnerability with a fix available fails the build (docs/fatias/09c-release.md).
      - name: Scan images (Trivy)
        run: |
          mkdir -p trivy
          for image in devops-agent:ci devops-demo-api:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/trivy:/out" \
              aquasec/trivy:0.74.0 image --quiet --exit-code 0 --format json --output "/out/${image%%:*}.json" "$image"
          done
          ./scripts/trivy-summary.sh trivy/devops-agent.json trivy/devops-demo-api.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan
          path: trivy/
      - name: Fail on CRITICAL vulnerabilities with a fix available
        run: ./scripts/trivy-gate.sh trivy/devops-agent.json trivy/devops-demo-api.json
