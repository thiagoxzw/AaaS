spring:
  application:
    name: devops-agent
  # The datasource has no defaults on purpose: without SPRING_DATASOURCE_* the application fails fast
  # instead of silently connecting somewhere unexpected.
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  jackson:
    deserialization:
      # Unknown fields are rejected instead of silently ignored (e.g. an organizationId in a body, TM-B1-05).
      fail-on-unknown-properties: true

server:
  port: 8080

management:
  server:
    # Actuator lives on a separate port that is never published to the host (docs/fatias/00-esqueleto.md).
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # Slice 9b: p95 on the Agente dashboard.
        devops.approval.wait: true
        devops.tool.restart.verification.duration: true

logging:
  structured:
    format:
      console: ecs

devops:
  security:
    jwt:
      # secret: from JWT_SECRET (required, at least 32 bytes)
      issuer: devops-agent
      ttl: 15m
    login:
      max-failures-per-email: 5
      max-failures-per-ip: 50
      window: 15m
  # bootstrap.admin-email / bootstrap.admin-password: from ADMIN_EMAIL / ADMIN_PASSWORD
  tools:
    max-concurrent-executions: 16
    max-retries: 3
    initial-backoff: 200ms
  agent:
    # Budgets per execution (RF-26, RNF-CONF-01..03); every proposal counts, denied ones included.
    max-tool-calls: 10
    max-llm-iterations: 8
    max-active-time: 5m
    conversation-window: 10
    # In-process dispatcher (docs/03-arquitetura.md, section 8).
    workers: 4
    queue-capacity: 50
    recover-on-startup: true
  approval:
    # Human approval of risky calls (slice 7, RF-41..43, ADR-0006).
    ttl: 15m
    # Closes approvals past their deadline and resumes executions with nothing pending left.
    sweep-interval: 30s
    sweep-enabled: true
  llm:
    # scripted: deterministic scripts from classpath:llm-scripts, no API key.
    # openai: the Responses API (slice 6); needs the key, the model, the prices and a daily budget.
    provider: ${LLM_PROVIDER:scripted}
    timeout: 30s
    max-output-tokens: 1024
    daily-budget-usd: ${LLM_DAILY_BUDGET_USD:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${LLM_MODEL:}
      input-price-per-million-usd: ${LLM_PRICE_INPUT_PER_MTOK_USD:}
      output-price-per-million-usd: ${LLM_PRICE_OUTPUT_PER_MTOK_USD:}
      max-retries: 2
      max-retry-after: 10s
  diagnostics:
    # Deterministic container findings (docs/05-contratos-das-ferramentas.md, section 8.3).
    restart-loop-threshold: 3
    recently-started-window: 60s
  runtime:
    # An environment stores only the connection name (RF-13); the URL is here. It points to the
    # docker-socket-proxy, never to the Docker socket (ADR-011).
    connections:
      local:
        docker-url: ${DEVOPS_RUNTIME_LOCAL_DOCKER_URL:http://docker-socket-proxy:2375}
    docker:
      api-version: "1.44"
      # Below every tool's timeout (10 s and 15 s), so the HTTP call ends before the executor gives up.
      connect-timeout: 2s
      read-timeout: 8s
      max-response-bytes: 1048576
      max-line-length: 2000
