spring:
  application:
    name: devops-agent
  # The datasource has no defaults on purpose: without SPRING_DATASOURCE_* the application fails fast
  # instead of silently connecting somewhere unexpected.

server:
  port: 8080

management:
  server:
    # Actuator lives on a separate port that is never published to the host (docs/fatias/00-esqueleto.md).
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs
