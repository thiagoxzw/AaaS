name: devops-aaas

# Every published port is bound to 127.0.0.1 (RNF-SEG-15); CI enforces it with scripts/check-compose-ports.sh.
# Secrets have no defaults: a missing .env stops the stack instead of starting it with weak credentials.
# Only docker-socket-proxy mounts the Docker socket, and it publishes no port (ADR-011); CI enforces both with
# scripts/check-compose-docker-socket.sh.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: devops_agent
      POSTGRES_USER: devops_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_agent -d devops_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    networks: [backend]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: devops-agent:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devops_agent
      SPRING_DATASOURCE_USERNAME: devops_agent
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      DEVOPS_SECURITY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      DEVOPS_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env (see .env.example)}
      DEVOPS_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}
      # scripted until slice 6: the agent runs locally without an API key.
      LLM_PROVIDER: ${LLM_PROVIDER:-scripted}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Actuator is on the internal management port, which is not published.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    # docker-proxy: the only way to the Docker Engine, through the proxy (ADR-011).
    networks: [backend, docker-proxy]

  # The backend's only path to Docker. It allows reading containers and their logs; creating, starting,
  # executing into, deleting containers, images, volumes, networks and events are refused with 403.
  # Restart stays off until slice 8, which brings the tool that needs it (least privilege per slice).
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.4.5@sha256:ca6c0301a652232d02cb0ff9f1c5d20d9b339f391e1c1dffaae6ef3bfc59d009
    environment:
      CONTAINERS: "1"
      ALLOW_LOGS: "1"
      ALLOW_RESTARTS: "0"
      POST: "0"
      EVENTS: "0"
      PING: "1"
      VERSION: "1"
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No ports: reachable only from the internal docker-proxy network.
    networks: [docker-proxy]

  # The service the agent operates in the demo. Its chaos endpoints have no authentication on purpose, so the
  # port is published on 127.0.0.1 only. It needs no network of the platform: the agent reaches it only
  # through the Docker API.
  demo-api:
    build:
      context: .
      dockerfile: demo-api/Dockerfile
    image: devops-demo-api:local
    container_name: devops-demo-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8090:8080"
    networks: [demo]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]

volumes:
  postgres-data:
  grafana-data:

networks:
  backend:
  # internal: no route outside Docker, and nothing on it can be reached from the host.
  docker-proxy:
    internal: true
  demo:
